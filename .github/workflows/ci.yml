name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run ruff check src tests eval lambda scripts
      - run: uv run ruff format --check src tests eval lambda scripts
      - run: uv run pytest -q -p no:warnings
      - run: uv run python eval/corpus_check.py
